{{- if not (or .Values.database.url .Values.database.existingSecret) }}
{{- fail "set database.url or database.existingSecret" }}
{{- end }}
{{- if and .Values.database.url .Values.database.existingSecret }}
{{- fail "set only one of database.url and database.existingSecret" }}
{{- end }}
{{- if .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "idp.databaseSecretName" . }}
  labels: {{- include "idp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
---
{{- end }}
{{- if not .Values.bootstrapToken.existingSecret }}
{{- $name := include "idp.bootstrapSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "idp.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.bootstrapToken.existingSecretKey }}: {{ if $existing }}{{ index $existing.data .Values.bootstrapToken.existingSecretKey }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
