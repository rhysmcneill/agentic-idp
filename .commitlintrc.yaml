# commitlint config for agentic-idp. Used by the commitlint pre-commit hook
# (see .pre-commit-config.yaml) to enforce conventional commits, per
# CLAUDE.md's "Git & commits" — groundwork for semantic-release in Phase 1.

extends:
  - "@commitlint/config-conventional"

rules:
  type-enum:
    - 2
    - always
    - [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
  subject-case:
    - 2
    - never
    - [start-case, pascal-case, upper-case]
  header-max-length:
    - 2
    - always
    - 200
