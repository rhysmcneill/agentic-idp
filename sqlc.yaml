version: "2"
sql:
  - schema: "controlplane/migrations/*.up.sql"
    queries: "controlplane/internal/tenant/queries"
    engine: "postgresql"
    gen:
      go:
        package: "sqlcgen"
        out: "controlplane/internal/tenant/sqlcgen"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
